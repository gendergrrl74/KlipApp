<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>TENSe — Diagnóstico Psicodinámico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #B8860B;
  --gold-light: #D4A017;
  --gold-pale: #F5EDD6;
  --ink: #1A1A2E;
  --ink-mid: #3D3D5C;
  --ink-light: #7A7A9A;
  --surface: #FFFFFF;
  --surface-2: #F8F7F4;
  --border: rgba(0,0,0,0.12);
  --text: #1A1A2E;
  --text-muted: #6B6B8A;
  --excess: #7B2D2D;
  --deficit: #1A3A5C;
  --tiferet: #2D5A27;
  --radius: 8px;
  --radius-lg: 12px;
}

body {
  font-family: 'Cormorant Garamond', serif;
  background: #F2EFE8;
  color: var(--text);
  min-height: 100vh;
}

.app {
  max-width: 860px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem;
}

.header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 0.5px solid var(--border);
}

.header-title {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 500;
  color: var(--gold);
  letter-spacing: 0.12em;
}

.header-sub {
  font-size: 14px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 6px;
  letter-spacing: 0.04em;
}

.nav {
  display: flex;
  gap: 0;
  margin-bottom: 2rem;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}

.nav-btn {
  flex: 1;
  padding: 11px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  transition: all 0.2s;
}

.nav-btn:not(:last-child) { border-right: 0.5px solid var(--border); }
.nav-btn.active { background: var(--gold); color: white; }
.nav-btn:hover:not(.active) { background: var(--surface-2); }

.panel { display: none; }
.panel.active { display: block; }

.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.section-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-bottom: 6px;
  border-bottom: 0.5px solid var(--gold-pale);
}

.ancestros-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  margin-bottom: 1rem;
  user-select: none;
}

.ancestros-toggle-label {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.ancestros-toggle-icon {
  font-size: 13px;
  color: var(--gold);
  transition: transform 0.2s;
}

.ancestros-toggle-icon.open { transform: rotate(90deg); }

.ancestros-grid {
  display: none;
  flex-direction: column;
  gap: 1rem;
}

.ancestros-grid.open { display: flex; }

.ancestro-row {
  display: grid;
  grid-template-columns: 160px 1fr 1fr 1fr;
  gap: 10px;
  align-items: end;
}

.ancestro-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  padding-bottom: 10px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }

.form-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.form-input {
  padding: 10px 14px;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  color: var(--text);

}

.form-input:focus {

  border-color: var(--gold);
  background: var(--surface);
}

.form-input.ancestro {
  font-size: 15px;
  padding: 8px 12px;
}

.btn-primary {

  background: var(--gold);
  border: none;
  border-radius: var(--radius);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.1em;
  color: white;

}

.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.error-msg {

  border-radius: var(--radius);
  color: var(--excess);

.profile-grid {

  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 1.5rem;
}

.profile-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 10px;

.profile-card-plano {

  font-size: 9px;

.profile-card-sefira {

.profile-card-or {

.zona-saturacion { background: #F5E6E6; color: var(--excess); }
.zona-tenso { background: #FDF3E6; color: #7A4A0A; }
.zona-tiferet { background: #E6F5E6; color: var(--tiferet); }
.zona-precario { background: #E6EEF5; color: var(--deficit); }
.zona-vaciado { background: #EEE6F5; color: #4A1A7A; }

/* Badges de resonancia transgeneracional */
.resonancia-badges {

.badge {

.badge-presion { background: #3D1A1A; color: #F5C6C6; }

.output-section {

.output-header {

.output-header-label {

.output-header-sefira {

.sintesis-header {

.btn-export {

  font-size: 11px;
  letter-spacing: 0.06em;

  cursor: pointer;

.historial-list { display: flex; flex-direction: column; gap: 8px; }

.historial-item {

.historial-item:hover { border-color: var(--gold); }

.historial-name {

  color: var(--text);
}

.historial-fecha {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 3px;

}

.historial-meta {

.historial-delete {

  color: var(--text-muted);

  padding: 4px 8px;

  transition: opacity 0.2s;
  margin-left: 8px;

.historial-delete:hover { opacity: 1; color: var(--excess); }

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
  font-style: italic;
  font-size: 16px;
}

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0,0,0,0.1);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .profile-grid { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: 1; }
  .ancestro-row { grid-template-columns: 1fr; gap: 6px; }
  .ancestro-label { padding-bottom: 0; }
}
</style>

              <div class="ancestro-label">Padre</div>

<script>
const SEFIROT = {
  1:'Keter', 2:'Chokmah', 3:'Binah', 4:'Chesed', 5:'Gevurah',
  6:'Tiferet', 7:'Netzaj', 8:'Hod', 9:'Yesod', 10:'Malkut',
  11:"Da'at", 22:'El Arquitecto', 33:'El Maestro Compasivo'
};

function reducir(n) {
  if (n <= 9 || n === 10 || n === 11 || n === 22 || n === 33) return n;
  let s = String(n).split('').reduce((a,b) => a + parseInt(b), 0);
  return reducir(s);
}

function getZona(t) {
  if (t === null) return 'tzimtzum';
  if (t <= 0.30) return 'vaciado';
  if (t <= 0.45) return 'precario';
  if (t <= 0.55) return 'tiferet';
  if (t <= 0.70) return 'tenso';
  return 'saturacion';
}

function zonaNombre(z) {
  return { vaciado:'Vaciado', precario:'Precario', tiferet:'Punto Tiferet',
           tenso:'Tenso', saturacion:'Saturación', tzimtzum:'Tzimtzum' }[z];
}

function esExceso(zona) { return zona === 'saturacion' || zona === 'tenso'; }
function esDeficit(zona) { return zona === 'precario' || zona === 'vaciado'; }

function calcularPerfil(dia, mes, anio) {
  const D = reducir(dia);
  const M = reducir(mes);
  const agRaw = String(anio).split('').reduce((a,b) => a+parseInt(b), 0);
  const AG = reducir(agRaw);

  const f1Or = D, f1Kli = Math.abs(D - M);
  const f1T = f1Kli === 0 ? null : parseFloat((f1Or / f1Kli).toFixed(2));

  const f2Or = M, f2Kli = Math.abs(M - AG);
  const f2T = f2Kli === 0 ? null : parseFloat((f2Or / f2Kli).toFixed(2));

  const f3Or = AG, f3Kli = Math.abs(D - AG);
  const f3T = f3Kli === 0 ? null : parseFloat((f3Or / f3Kli).toFixed(2));

  const f4Or = reducir(D + M + AG);
  const f4Kli = parseFloat(((f1T||0) + (f2T||0) + (f3T||0)).toFixed(2));
  const f4T = f4Kli === 0 ? null : parseFloat((f4Or / f4Kli).toFixed(2));

  return [
    { plano:'F1', nombre:'Alma', mundo:'Atzilut', or:f1Or, kli:f1Kli, tense:f1T, zona:getZona(f1T) },
    { plano:'F2', nombre:'Mente', mundo:'Briáh', or:f2Or, kli:f2Kli, tense:f2T, zona:getZona(f2T) },
    { plano:'F3', nombre:'Yo Social', mundo:'Yetziráh', or:f3Or, kli:f3Kli, tense:f3T, zona:getZona(f3T) },
    { plano:'F4', nombre:'Cuerpo', mundo:'Assiáh', or:f4Or, kli:f4Kli, tense:f4T, zona:getZona(f4T) },
  ];
}

// ─── LÓGICA TRANSGENERACIONAL ───────────────────────────────────────────────

function leerAncestro(prefijoDia, prefijoMes, prefijoAnio) {
  const d = parseInt(document.getElementById(prefijoDia).value);
  const m = parseInt(document.getElementById(prefijoMes).value);
  const a = parseInt(document.getElementById(prefijoAnio).value);
  if (!d || !m || !a || isNaN(d) || isNaN(m) || isNaN(a)) return null;
  return { dia: d, mes: m, anio: a };
}

function calcularResonancias(perfilConsultante, ancestros) {
  // ancestros: array de { nombre, perfil }
  // Para cada plano del consultante, determinar el tipo de resonancia
  return perfilConsultante.map((f, i) => {
    if (f.zona === 'tzimtzum') return { tipo: null, ancestrosInvolucrados: [] };

    const coincidencias = [];
    ancestros.forEach(({ nombre, perfil }) => {
      const fa = perfil[i]; // mismo plano en el ancestro
      if (!fa || fa.zona === 'tzimtzum') return;
      if (fa.or === f.or) {
        // misma sefiráh
        if (
          (esExceso(f.zona) && esExceso(fa.zona)) ||
          (esDeficit(f.zona) && esDeficit(fa.zona))
        ) {
          coincidencias.push({ nombre, tipo: 'directa' });
        } else if (
          (esExceso(f.zona) && esDeficit(fa.zona)) ||
          (esDeficit(f.zona) && esExceso(fa.zona))
        ) {
          coincidencias.push({ nombre, tipo: 'compensatoria' });
        }
      }
    });

    const directas = coincidencias.filter(c => c.tipo === 'directa');
    const compensatorias = coincidencias.filter(c => c.tipo === 'compensatoria');

    let tipo = null;
    if (directas.length > 0) tipo = 'presion';
    else if (compensatorias.length > 0) tipo = 'compensacion';
    else if (ancestros.length > 0) tipo = 'pionero';

    return {
      tipo,
      directas: directas.map(c => c.nombre),
      compensatorias: compensatorias.map(c => c.nombre)
    };
  });
}

function buildPrompt(nombre, dia, mes, anio, perfil, ancestros, resonancias) {
  const lines = perfil.map((f, i) => {
    const r = resonancias[i];
    let resonanciaStr = '';
    if (r && r.tipo === 'presion') {
      resonanciaStr = ` | PRESIÓN TRANSGENERACIONAL DIRECTA (${r.directas.join(', ')}): la klipá viene consolidada desde el campo ancestral, patrón heredado sin transformación`;
    } else if (r && r.tipo === 'compensacion') {
      resonanciaStr = ` | RESONANCIA COMPENSATORIA (${r.compensatorias.join(', ')}): vector opuesto en ancestro/s — posible implicación sistémica, lealtad invisible, respuesta al desequilibrio del campo`;
    } else if (r && r.tipo === 'pionero') {
      resonanciaStr = ` | TIKÚN PIONERO: sefiráh sin precedente en el campo ancestral disponible — territorio inaugural, mayor desorientación pero también mayor libertad`;
    }
    return `${f.plano} — ${f.nombre} (${f.mundo}): Or=${f.or} (${SEFIROT[f.or]||f.or}), Kli=${f.kli}, TENSe=${f.tense!==null?f.tense:'Tzimtzum'}, Zona=${zonaNombre(f.zona)}${resonanciaStr}`;
  }).join('\n');

  const ancestrosStr = ancestros.length > 0
    ? `\nCampo transgeneracional incluido: ${ancestros.map(a => `${a.nombre} (${a.dia}/${a.mes}/${a.anio})`).join(', ')}.`
    : '\nNo se dispone de fechas ancestrales.';

  return `Eres un sistema de diagnóstico psicodinámico que integra psicología clínica profunda y Kabbalah. Generás diagnósticos narrativos precisos para terapeutas especializados con formación kabbalística y transgeneracional.

El sistema TENSe calcula el Or (luz/sefirá activa) y el Kli (vasija/resistencia) de cuatro planos de existencia (Atzilut=Alma, Briáh=Mente, Yetziráh=Yo Social, Assiáh=Cuerpo). El coeficiente TENSe (Or/Kli) determina si la sefirá opera en exceso (>1: Tenso/Saturación) o en déficit (<1: Precario/Vaciado). El Punto Tiferet (~1) es el equilibrio óptimo. Las klipot son las sombras que emergen cuando la sefirá opera fuera del equilibrio — cada sefiráh tiene klipot de exceso y klipot de déficit cualitativamente distintas.

Cuando se indica PRESIÓN TRANSGENERACIONAL DIRECTA: la klipá viene con peso acumulado del campo, arraigada en el linaje, de tikún más urgente y más resistente. La narrativa debe incluir la dimensión heredada.

Cuando se indica RESONANCIA COMPENSATORIA: el consultante porta el vector opuesto al ancestro — posible implicación sistémica en términos de constelaciones familiares. La narrativa debe señalar la lealtad invisible y el movimiento de desengancho necesario.

Cuando se indica TIKÚN PIONERO: no hay precedente en el campo disponible. La narrativa debe señalar tanto la desorientación que implica inaugurar un patrón como la potencia transformadora para el campo.

Perfil del consultante: ${nombre}
Fecha de nacimiento: ${dia}/${mes}/${anio}${ancestrosStr}

${lines}

Generá un diagnóstico narrativo completo con este formato exacto:

**F1 — ALMA / Atzilut**
[Párrafo de 5-7 líneas. Nombrar la sefirá, la zona, la klipá activa y — si aplica — la dimensión transgeneracional. Lenguaje kabbalístico-clínico preciso. Sin subtítulos internos.]

**F2 — MENTE / Briáh**
[Párrafo de 5-7 líneas. Misma estructura.]

**F3 — YO SOCIAL / Yetziráh**
[Párrafo de 5-7 líneas. Misma estructura.]

**F4 — CUERPO / Assiáh**
[Párrafo de 5-7 líneas. Misma estructura.]

**SÍNTESIS INTEGRADORA**
[Párrafo de 8-10 líneas. Lectura analítica del sistema completo: patrón estructural, tensiones entre planos, peso transgeneracional global, centro de gravedad clínico. No repetir lo dicho — integrar. Si hay campo ancestral, señalar qué tikumim son heredados y cuáles inaugurales.]

Tono: preciso, denso, no didáctico. El lector es terapeuta con formación kabbalística y transgeneracional.`;
}

let currentResult = null;

function toggleAncestros() {
  const grid = document.getElementById('ancestros-grid');
  const icon = document.getElementById('ancestros-icon');
  const isOpen = grid.classList.toggle('open');
  icon.classList.toggle('open', isOpen);
}

async function calcular() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const dia = parseInt(document.getElementById('inp-dia').value);
  const mes = parseInt(document.getElementById('inp-mes').value);
  const anio = parseInt(document.getElementById('inp-anio').value);
  const errEl = document.getElementById('error-msg');

  errEl.style.display = 'none';

  if (!nombre || !dia || !mes || !anio || isNaN(dia) || isNaN(mes) || isNaN(anio)) {
    errEl.textContent = 'Por favor completá nombre y fecha del consultante.';
    errEl.style.display = 'block';
    return;
  }

  const perfil = calcularPerfil(dia, mes, anio);

  // Leer ancestros opcionales
  const ancestrosDefs = [
    { id: 'madre', label: 'Madre' },
    { id: 'padre', label: 'Padre' },
    { id: 'abuela-m', label: 'Abuela materna' },
    { id: 'abuelo-m', label: 'Abuelo materno' },
    { id: 'abuela-p', label: 'Abuela paterna' },
    { id: 'abuelo-p', label: 'Abuelo paterno' },
  ];

  const ancestros = [];
  ancestrosDefs.forEach(({ id, label }) => {
    const raw = leerAncestro(`${id}-dia`, `${id}-mes`, `${id}-anio`);
    if (raw) {
      ancestros.push({
        nombre: label,
        dia: raw.dia,
        mes: raw.mes,
        anio: raw.anio,
        perfil: calcularPerfil(raw.dia, raw.mes, raw.anio)
      });
    }
  });

  const resonancias = calcularResonancias(perfil, ancestros);

  const btn = document.getElementById('btn-calcular');
  btn.disabled = true;
  btn.textContent = 'Generando...';

  const resEl = document.getElementById('resultado');
  resEl.style.display = 'block';
  resEl.innerHTML = renderPerfil(nombre, dia, mes, anio, perfil, ancestros, resonancias, null, true);

  try {
    const response = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: buildPrompt(nombre, dia, mes, anio, perfil, ancestros, resonancias) })
    });

    const data = await response.json();
    const texto = data.content?.find(b => b.type === 'text')?.text || '';

    if (!texto) throw new Error('Respuesta vacía');

    currentResult = {
      nombre, dia, mes, anio, perfil,
      ancestros: ancestros.map(a => ({ nombre: a.nombre, dia: a.dia, mes: a.mes, anio: a.anio, perfil: a.perfil })),
      resonancias,
      diagnostico: texto,
      fecha: new Date().toISOString()
    };
    guardarEnHistorial(currentResult);
    resEl.innerHTML = renderPerfil(nombre, dia, mes, anio, perfil, ancestros, resonancias, texto, false);

  } catch(e) {
    errEl.textContent = 'Error al generar el diagnóstico. Verificá tu conexión o contactá al administrador.';
    errEl.style.display = 'block';
    resEl.style.display = 'none';
  }

  btn.disabled = false;
  btn.textContent = 'Generar diagnóstico';
}

function parseOutput(texto) {
  const s = {};
  const p = [
    { k:'f1', r:/\*\*F1[^*]*\*\*\s*([\s\S]*?)(?=\*\*F2|\*\*SÍNT|$)/i },
    { k:'f2', r:/\*\*F2[^*]*\*\*\s*([\s\S]*?)(?=\*\*F3|\*\*SÍNT|$)/i },
    { k:'f3', r:/\*\*F3[^*]*\*\*\s*([\s\S]*?)(?=\*\*F4|\*\*SÍNT|$)/i },
    { k:'f4', r:/\*\*F4[^*]*\*\*\s*([\s\S]*?)(?=\*\*SÍNT|$)/i },
    { k:'sintesis', r:/\*\*SÍNTESIS[^*]*\*\*\s*([\s\S]*?)$/i },
  ];
  p.forEach(({k,r}) => { const m = texto.match(r); s[k] = m ? m[1].trim() : ''; });
  return s;
}

function resonanciaBadge(r) {
  if (!r || !r.tipo) return '';
  if (r.tipo === 'presion') return `<span class="badge badge-presion">Presión · ${r.directas.join(', ')}</span>`;
  if (r.tipo === 'compensacion') return `<span class="badge badge-compensacion">Compensación · ${r.compensatorias.join(', ')}</span>`;
  if (r.tipo === 'pionero') return `<span class="badge badge-pionero">Tikún pionero</span>`;
  return '';
}

function renderPerfil(nombre, dia, mes, anio, perfil, ancestros, resonancias, diagnostico, loading) {
  const s = diagnostico ? parseOutput(diagnostico) : {};
  const claves = ['f1','f2','f3','f4'];
  const labels = ['F1 — Alma · Atzilut','F2 — Mente · Briáh','F3 — Yo Social · Yetziráh','F4 — Cuerpo · Assiáh'];

  const ancestrosInfo = ancestros && ancestros.length > 0
    ? `Campo transgeneracional: ${ancestros.map(a => `${a.nombre} (${a.dia}/${a.mes}/${a.anio})`).join(' · ')}`
    : '';

  let html = `
    <div class="consultant-header">
      <div class="consultant-name">${nombre}</div>
      <div class="consultant-fecha">${dia}/${mes}/${anio}</div>
      ${ancestrosInfo ? `<div class="consultant-ancestros">${ancestrosInfo}</div>` : ''}
    </div>
    <div class="profile-grid">
      ${perfil.map((f, i) => `
        <div class="profile-card">
          <div class="profile-card-plano">${f.nombre}</div>
          <div class="profile-card-sefira">${SEFIROT[f.or]||f.or}</div>
          <div class="profile-card-or">Or = ${f.or}</div>
          <span class="profile-card-zona zona-${f.zona}">${zonaNombre(f.zona)}</span>
          ${resonancias && resonancias[i] && resonancias[i].tipo ? `<div class="resonancia-badges">${resonanciaBadge(resonancias[i])}</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;

  perfil.forEach((f, i) => {
    const contenido = loading
      ? `<span class="spinner"></span> Generando diagnóstico...`
      : (s[claves[i]] || '—');
    const badge = resonancias && resonancias[i] ? resonanciaBadge(resonancias[i]) : '';
    html += `
      <div class="output-section">
        <div class="output-header">
          <span class="output-header-label">${labels[i]}</span>
          <span style="flex:1"></span>
          ${badge}
          <span class="output-header-sefira" style="margin-left:8px">${SEFIROT[f.or]||f.or} · ${zonaNombre(f.zona)}</span>
        </div>
        <div class="output-body ${loading?'loading':''}">${contenido}</div>
      </div>
    `;
  });

  const sinContenido = loading
    ? `<span class="spinner"></span> Generando síntesis...`
    : (s['sintesis'] || '—');

  html += `
    <div class="output-section">
      <div class="output-header sintesis-header">
        <span class="output-header-label">Síntesis integradora</span>
        <span style="flex:1"></span>
        <span class="output-header-sefira">Lectura del sistema completo</span>
      </div>
      <div class="output-body ${loading?'loading':''}">${sinContenido}</div>
    </div>
  `;

  if (!loading) {
    html += `
      <div class="export-bar">
        <button class="btn-export" onclick="exportarPDF()">↓ Exportar PDF</button>
      </div>
    `;
  }

  return html;
}

function guardarEnHistorial(entry) {
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  stored.unshift(entry);
  if (stored.length > 200) stored.pop();
  localStorage.setItem('tense_historial', JSON.stringify(stored));
}

function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'historial') renderHistorial();
}

function renderHistorial() {
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  const el = document.getElementById('historial-content');
  if (!stored.length) {
    el.innerHTML = '<div class="empty-state">No hay diagnósticos guardados aún.</div>';
    return;
  }
  el.innerHTML = `<div class="historial-list">
    ${stored.map((e, i) => {
      const tieneAncestros = e.ancestros && e.ancestros.length > 0;
      return `
      <div class="historial-item" onclick="verHistorial(${i})">
        <div>
          <div class="historial-name">${e.nombre}</div>
          <div class="historial-fecha">${e.dia}/${e.mes}/${e.anio}${tieneAncestros ? ` · ${e.ancestros.length} ancestro${e.ancestros.length>1?'s':''}` : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="historial-meta">${new Date(e.fecha).toLocaleDateString('es-AR')}</div>
          <button class="historial-delete" onclick="event.stopPropagation();eliminarHistorial(${i})" title="Eliminar">×</button>
        </div>
      </div>
    `}).join('')}
  </div>`;
}

function verHistorial(i) {
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  const e = stored[i];
  currentResult = e;
  showPanel('calcular');
  const resEl = document.getElementById('resultado');
  resEl.style.display = 'block';
  resEl.innerHTML = renderPerfil(
    e.nombre, e.dia, e.mes, e.anio, e.perfil,
    e.ancestros || [], e.resonancias || [],
    e.diagnostico, false
  );
}

function eliminarHistorial(i) {
  if (!confirm('¿Eliminar este diagnóstico del historial?')) return;
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  stored.splice(i, 1);
  localStorage.setItem('tense_historial', JSON.stringify(stored));
  renderHistorial();
}

function exportarPDF() {
  if (!currentResult) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const e = currentResult;
  const margin = 22, maxW = 210 - margin * 2;
  let y = 22;

  const line = (text, size, style, rgb) => {
    doc.setFontSize(size);
    doc.setFont('helvetica', style || 'normal');
    doc.setTextColor(...(rgb || [26, 26, 46]));
    const lines = doc.splitTextToSize(String(text), maxW);
    lines.forEach(l => {
      if (y > 272) { doc.addPage(); y = 22; }
      doc.text(l, margin, y);
      y += size * 0.46;
    });
    y += 2;
  };

  line('TENSe — Diagnóstico Psicodinámico', 17, 'bold', [184, 134, 11]);
  line(`${e.nombre}  ·  ${e.dia}/${e.mes}/${e.anio}`, 11, 'italic', [107, 107, 138]);

  if (e.ancestros && e.ancestros.length > 0) {
    line(`Campo transgeneracional: ${e.ancestros.map(a => `${a.nombre} (${a.dia}/${a.mes}/${a.anio})`).join(' · ')}`, 9, 'italic', [107, 107, 138]);
  }

  y += 5;

  const s = parseOutput(e.diagnostico);
  const labels = [
    'F1 — ALMA / Atzilut', 'F2 — MENTE / Briáh',
    'F3 — YO SOCIAL / Yetziráh', 'F4 — CUERPO / Assiáh'
  ];
  const claves = ['f1','f2','f3','f4'];

  e.perfil.forEach((f, i) => {
    if (y > 250) { doc.addPage(); y = 22; }
    const r = e.resonancias && e.resonancias[i];
    let resonanciaTag = '';
    if (r && r.tipo === 'presion') resonanciaTag = ` · Presión: ${r.directas.join(', ')}`;
    else if (r && r.tipo === 'compensacion') resonanciaTag = ` · Compensación: ${r.compensatorias.join(', ')}`;
    else if (r && r.tipo === 'pionero') resonanciaTag = ' · Tikún pionero';
    line(`${labels[i]}  ·  ${SEFIROT[f.or]||f.or}  ·  ${zonaNombre(f.zona)}${resonanciaTag}`, 11, 'bold', [61, 61, 92]);
    y += 1;
    line(s[claves[i]] || '', 10, 'normal', [30, 30, 50]);
    y += 4;
  });

  if (y > 245) { doc.addPage(); y = 22; }
  line('SÍNTESIS INTEGRADORA', 11, 'bold', [26, 21, 92]);
  y += 1;
  line(s['sintesis'] || '', 10, 'normal', [30, 30, 50]);

  y += 10;
  line(`TENSe  ·  ${new Date().toLocaleDateString('es-AR')}`, 8, 'italic', [160, 160, 160]);

  doc.save(`TENSe_${e.nombre.replace(/\s+/g,'_')}_${e.dia}-${e.mes}-${e.anio}.pdf`);
}
