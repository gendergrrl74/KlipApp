<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENSe — Diagnóstico Psicodinámico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #B8860B;
  --gold-light: #D4A017;
  --gold-pale: #F5EDD6;
  --ink: #1A1A2E;
  --ink-mid: #3D3D5C;
  --ink-light: #7A7A9A;
  --surface: #FFFFFF;
  --surface-2: #F8F7F4;
  --border: rgba(0,0,0,0.12);
  --text: #1A1A2E;
  --text-muted: #6B6B8A;
  --excess: #7B2D2D;
  --deficit: #1A3A5C;
  --tiferet: #2D5A27;
  --radius: 8px;
  --radius-lg: 12px;
}

body {
  font-family: 'Cormorant Garamond', serif;
  background: #F2EFE8;
  color: var(--text);
  min-height: 100vh;
}

.app {
  max-width: 860px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem;
}

.header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 0.5px solid var(--border);
}

.header-title {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 500;
  color: var(--gold);
  letter-spacing: 0.12em;
}

.header-sub {
  font-size: 14px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 6px;
  letter-spacing: 0.04em;
}

.nav {
  display: flex;
  gap: 0;
  margin-bottom: 2rem;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}

.nav-btn {
  flex: 1;
  padding: 11px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  transition: all 0.2s;
}

.nav-btn:not(:last-child) { border-right: 0.5px solid var(--border); }
.nav-btn.active { background: var(--gold); color: white; }
.nav-btn:hover:not(.active) { background: var(--surface-2); }

.panel { display: none; }
.panel.active { display: block; }

.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.section-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-bottom: 6px;
  border-bottom: 0.5px solid var(--gold-pale);
}

.ancestros-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  margin-bottom: 1rem;
  user-select: none;
}

.ancestros-toggle-label {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.ancestros-toggle-icon {
  font-size: 13px;
  color: var(--gold);
  transition: transform 0.2s;
}

.ancestros-toggle-icon.open { transform: rotate(90deg); }

.ancestros-grid {
  display: none;
  flex-direction: column;
  gap: 1rem;
}

.ancestros-grid.open { display: flex; }

.ancestro-row {
  display: grid;
  grid-template-columns: 160px 1fr 1fr 1fr;
  gap: 10px;
  align-items: end;
}

.ancestro-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  padding-bottom: 10px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }

.form-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.form-input {
  padding: 10px 14px;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  color: var(--text);
  transition: border-color 0.2s;
}

.form-input:focus {
  outline: none;
  border-color: var(--gold);
  background: var(--surface);
}

.form-input.ancestro {
  font-size: 15px;
  padding: 8px 12px;
}

.btn-primary {
  width: 100%;
  padding: 13px;
  background: var(--gold);
  border: none;
  border-radius: var(--radius);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.1em;
  color: white;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-top: 1rem;
}

.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.error-msg {
  margin-top: 1rem;
  padding: 12px 16px;
  background: #F5E6E6;
  border-radius: var(--radius);
  color: var(--excess);
  font-size: 15px;
}

.profile-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 1.5rem;
}

.profile-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 10px;
  text-align: center;
}

.profile-card-plano {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.profile-card-sefira {
  font-size: 16px;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 2px;
}

.profile-card-or {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.profile-card-tense {
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-style: italic;
}

.profile-card-zona {
  font-size: 10px;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.04em;
  padding: 3px 10px;
  border-radius: 20px;
  display: inline-block;
}

.profile-card-necesita {
  font-size: 9px;
  font-style: italic;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 0.02em;
}

.zona-desborde   { background: #3D1A1A; color: #F5C6C6; }
.zona-saturacion { background: #F5E6E6; color: var(--excess); }
.zona-equilibrio { background: #E6F5E6; color: var(--tiferet); }
.zona-precario   { background: #E6EEF5; color: var(--deficit); }
.zona-vaciado    { background: #EEE6F5; color: #4A1A7A; }
.zona-tzimtzum   { background: #F0F0F0; color: #666; }

/* Badges de resonancia transgeneracional */
.resonancia-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
  justify-content: center;
}

.badge {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 20px;
  display: inline-block;
}

.badge-presion { background: #3D1A1A; color: #F5C6C6; }
.badge-compensacion { background: #1A2A3D; color: #C6D6F5; }
.badge-sosten { background: #3D331A; color: #F5E8C6; }
.badge-desplazada { background: #2E1A3D; color: #E3C6F5; }
.badge-realizado { background: #1A3D38; color: #C6F5EC; }
.badge-pionero { background: #1A3D1A; color: #C6F5C6; }
.observaciones-generaciones { font-size: 10px; color: var(--text-muted); font-style: italic; margin-top: 4px; }

.marcador-row { margin-top: -2px; }
.marcador-input {
  width: 100%;
  padding: 6px 10px;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  font-style: italic;
  color: var(--text);
}
.marcador-input::placeholder { color: var(--text-muted); opacity: 0.6; }

.observaciones {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 0.5px dashed var(--border);
}

.observacion-item {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  line-height: 1.6;
  margin-bottom: 4px;
  padding-left: 14px;
  position: relative;
}

.observacion-item::before {
  content: '·';
  position: absolute;
  left: 0;
  color: var(--gold);
  font-style: normal;
}

.observaciones-label {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0.7;
}

.consultant-header {
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--border);
}

.consultant-name {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.consultant-fecha {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 4px;
  font-style: italic;
}

.consultant-ancestros {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  font-style: italic;
  line-height: 1.6;
}

.output-section {
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 12px;
  background: var(--surface);
}

.output-header {
  padding: 11px 16px;
  background: var(--surface-2);
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.output-header-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.output-header-sefira {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  color: var(--gold);
  font-weight: 500;
}

.sintesis-header {
  background: var(--ink);
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
}

.sintesis-header .output-header-label { color: rgba(255,255,255,0.5); }
.sintesis-header .output-header-sefira { color: var(--gold-light); font-size: 11px; }

.output-body {
  padding: 18px 20px;
  font-size: 16px;
  line-height: 1.9;
  color: var(--text);
}

.output-body.loading {
  color: var(--text-muted);
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 10px;
}

.export-bar {
  display: flex;
  gap: 10px;
  margin-top: 1.5rem;
}

.btn-export {
  flex: 1;
  padding: 11px;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}

.btn-export:hover { border-color: var(--gold); color: var(--gold); }

.historial-list { display: flex; flex-direction: column; gap: 8px; }

.historial-item {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  cursor: pointer;
  transition: border-color 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.historial-item:hover { border-color: var(--gold); }

.historial-name {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  color: var(--text);
}

.historial-fecha {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 3px;
  font-style: italic;
}

.historial-meta {
  font-size: 12px;
  color: var(--text-muted);
  text-align: right;
}

.historial-delete {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 20px;
  padding: 4px 8px;
  opacity: 0.4;
  transition: opacity 0.2s;
  margin-left: 8px;
}

.historial-delete:hover { opacity: 1; color: var(--excess); }

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
  font-style: italic;
  font-size: 16px;
}

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0,0,0,0.1);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .profile-grid { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: 1; }
  .ancestro-row { grid-template-columns: 1fr; gap: 6px; }
  .ancestro-label { padding-bottom: 0; }
}
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-title">TENSe</div>
    <div class="header-sub">Sistema de Arquitectura Psicodinámica · Or / Kli</div>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-calcular" onclick="showPanel('calcular')">Calcular</button>
    <button class="nav-btn" id="nav-historial" onclick="showPanel('historial')">Historial</button>
  </div>

  <!-- PANEL CALCULAR -->
  <div id="panel-calcular" class="panel active">
    <div class="card">

      <!-- CONSULTANTE -->
      <div class="section-title">Consultante</div>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">Nombre</label>
          <input class="form-input" id="inp-nombre" type="text" placeholder="Nombre completo" />
        </div>
        <div class="form-group">
          <label class="form-label">Día</label>
          <input class="form-input" id="inp-dia" type="number" min="1" max="31" placeholder="DD" />
        </div>
        <div class="form-group">
          <label class="form-label">Mes</label>
          <input class="form-input" id="inp-mes" type="number" min="1" max="12" placeholder="MM" />
        </div>
        <div class="form-group full">
          <label class="form-label">Año</label>
          <input class="form-input" id="inp-anio" type="number" min="1900" max="2099" placeholder="AAAA" />
        </div>
      </div>


      <!-- HISTORIA RELEVANTE CONSULTANTE -->
      <div class="form-group full" style="margin-bottom:1.2rem">
        <label class="form-label">Historia relevante (opcional)</label>
        <textarea class="marcador-input" id="inp-historia" rows="3" placeholder="Ej. orfandad infantil, trauma temprano, enfermedad grave, migracion, abuso, perdidas significativas, contexto familiar relevante..." style="resize:vertical;width:100%;font-size:14px;line-height:1.6;padding:10px 14px;"></textarea>
      </div>

      <!-- ANCESTROS (opcionales) -->
      <div class="ancestros-toggle" onclick="toggleAncestros()">
        <span class="ancestros-toggle-icon" id="ancestros-icon">▶</span>
        <span class="ancestros-toggle-label">Campo transgeneracional (opcional)</span>
      </div>

      <div class="ancestros-grid" id="ancestros-grid">

        <div>
          <div class="section-title" style="margin-bottom:0.6rem">Padres</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div class="ancestro-row">
              <div class="ancestro-label">Madre</div>
              <div class="form-group">
                <label class="form-label">Día</label>
                <input class="form-input ancestro" id="madre-dia" type="number" min="1" max="31" placeholder="DD" />
              </div>
              <div class="form-group">
                <label class="form-label">Mes</label>
                <input class="form-input ancestro" id="madre-mes" type="number" min="1" max="12" placeholder="MM" />
              </div>
              <div class="form-group">
                <label class="form-label">Año</label>
                <input class="form-input ancestro" id="madre-anio" type="number" min="1900" max="2099" placeholder="AAAA" />
              </div>
            </div>
            <div class="marcador-row">
              <input class="marcador-input" id="madre-marcador" type="text" placeholder="Marcadores (opcional): ej. orfandad antes de los 10, migración, viudez temprana, fallecimiento prematuro..." />
              <textarea class="marcador-input" id="madre-historia" rows="2" placeholder="Historia relevante (opcional): ej. trauma, enfermedad, contexto clinico..." style="resize:vertical;width:100%;font-size:13px;margin-top:4px;"></textarea>
            </div>
            <div class="ancestro-row">
              <div class="ancestro-label">Padre</div>
              <div class="form-group">
                <label class="form-label">Día</label>
                <input class="form-input ancestro" id="padre-dia" type="number" min="1" max="31" placeholder="DD" />
              </div>
              <div class="form-group">
                <label class="form-label">Mes</label>
                <input class="form-input ancestro" id="padre-mes" type="number" min="1" max="12" placeholder="MM" />
              </div>
              <div class="form-group">
                <label class="form-label">Año</label>
                <input class="form-input ancestro" id="padre-anio" type="number" min="1900" max="2099" placeholder="AAAA" />
              </div>
            </div>
            <div class="marcador-row">
              <input class="marcador-input" id="padre-marcador" type="text" placeholder="Marcadores (opcional): ej. orfandad antes de los 10, migración, viudez temprana, fallecimiento prematuro..." />
              <textarea class="marcador-input" id="padre-historia" rows="2" placeholder="Historia relevante (opcional): ej. trauma, enfermedad, contexto clinico..." style="resize:vertical;width:100%;font-size:13px;margin-top:4px;"></textarea>
            </div>
          </div>
        </div>

        <div>
          <div class="section-title" style="margin-bottom:0.6rem">Abuelos maternos</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div class="ancestro-row">
              <div class="ancestro-label">Abuela materna</div>
              <div class="form-group">
                <label class="form-label">Día</label>
                <input class="form-input ancestro" id="abuela-m-dia" type="number" min="1" max="31" placeholder="DD" />
              </div>
              <div class="form-group">
                <label class="form-label">Mes</label>
                <input class="form-input ancestro" id="abuela-m-mes" type="number" min="1" max="12" placeholder="MM" />
              </div>
              <div class="form-group">
                <label class="form-label">Año</label>
                <input class="form-input ancestro" id="abuela-m-anio" type="number" min="1900" max="2099" placeholder="AAAA" />
              </div>
            </div>
            <div class="marcador-row">
              <input class="marcador-input" id="abuela-m-marcador" type="text" placeholder="Marcadores (opcional): ej. orfandad antes de los 10, migración, viudez temprana, fallecimiento prematuro..." />
              <textarea class="marcador-input" id="abuela-m-historia" rows="2" placeholder="Historia relevante (opcional): ej. trauma, enfermedad, contexto clinico..." style="resize:vertical;width:100%;font-size:13px;margin-top:4px;"></textarea>
            </div>
            <div class="ancestro-row">
              <div class="ancestro-label">Abuelo materno</div>
              <div class="form-group">
                <label class="form-label">Día</label>
                <input class="form-input ancestro" id="abuelo-m-dia" type="number" min="1" max="31" placeholder="DD" />
              </div>
              <div class="form-group">
                <label class="form-label">Mes</label>
                <input class="form-input ancestro" id="abuelo-m-mes" type="number" min="1" max="12" placeholder="MM" />
              </div>
              <div class="form-group">
                <label class="form-label">Año</label>
                <input class="form-input ancestro" id="abuelo-m-anio" type="number" min="1900" max="2099" placeholder="AAAA" />
              </div>
            </div>
            <div class="marcador-row">
              <input class="marcador-input" id="abuelo-m-marcador" type="text" placeholder="Marcadores (opcional): ej. orfandad antes de los 10, migración, viudez temprana, fallecimiento prematuro..." />
              <textarea class="marcador-input" id="abuelo-m-historia" rows="2" placeholder="Historia relevante (opcional): ej. trauma, enfermedad, contexto clinico..." style="resize:vertical;width:100%;font-size:13px;margin-top:4px;"></textarea>
            </div>
          </div>
        </div>

        <div>
          <div class="section-title" style="margin-bottom:0.6rem">Abuelos paternos</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div class="ancestro-row">
              <div class="ancestro-label">Abuela paterna</div>
              <div class="form-group">
                <label class="form-label">Día</label>
                <input class="form-input ancestro" id="abuela-p-dia" type="number" min="1" max="31" placeholder="DD" />
              </div>
              <div class="form-group">
                <label class="form-label">Mes</label>
                <input class="form-input ancestro" id="abuela-p-mes" type="number" min="1" max="12" placeholder="MM" />
              </div>
              <div class="form-group">

<script>
const SEFIROT = {
  1:'Kéter', 2:'Jojmá', 3:'Biná', 4:'Jésed', 5:'Gevurá',
  6:'Tiferet', 7:'Netzaj', 8:'Hod', 9:'Yesod', 10:'Maljut',
  11:"Da'at"
};

function reducir(n) {
  // 10 nativo → Maljut (no se reduce). 11 nativo → Da'at (no se reduce).
  // Cualquier otro valor > 9 se reduce hasta llegar a 1-9.
  if (n <= 9 || n === 10 || n === 11) return n;
  let s = String(n).split('').reduce((a,b) => a + parseInt(b), 0);
  return reducir(s);
}

// ─── COEFICIENTE TENSe ──────────────────────────────────────────────────────
// Fórmula: Or / Kli — razón directa entre luz y vasija.
// Equilibrio Operativo: 1.00 – 1.50. Or = Kli exacto → 1.0 (centro del rango).
// > 1: más luz que vasija (exceso). < 1: más vasija que luz (déficit).
// Kli = 0 → Tzimtzum (caso especial, no se calcula coeficiente).

function coeficiente(or, kli) {
  if (kli === 0) return null; // Tzimtzum
  return parseFloat((or / kli).toFixed(2));
}

function getZona(t) {
  if (t === null) return 'tzimtzum';
  if (t < 0.50)  return 'vaciado';      // Klipá de la Apatía
  if (t < 1.00)  return 'precario';     // Klipá de la Inseguridad
  if (t <= 1.50) return 'equilibrio';   // Equilibrio Operativo — sin klipá
  if (t <= 3.00) return 'saturacion';   // Klipá de la Obsesión
  return 'desborde';                    // Klipá del Quiebre / Shevirat HaKelim
}

function zonaNombre(z) {
  return {
    vaciado:    'Vaciado',
    precario:   'Precario',
    equilibrio: 'Equilibrio Operativo',
    saturacion: 'Saturación',
    desborde:   'Desborde',
    tzimtzum:   'Tzimtzum'
  }[z] || z;
}

function esExceso(zona) { return zona === 'saturacion' || zona === 'desborde'; }
function esDeficit(zona) { return zona === 'precario' || zona === 'vaciado'; }

function calcularPerfil(dia, mes, anio) {
  const D = reducir(dia);
  const M = reducir(mes);
  const agRaw = String(anio).split('').reduce((a,b) => a+parseInt(b), 0);
  const AG = reducir(agRaw);

  const f1Or = D, f1Kli = Math.abs(D - M);
  const f1T = coeficiente(f1Or, f1Kli);

  const f2Or = M, f2Kli = Math.abs(M - AG);
  const f2T = coeficiente(f2Or, f2Kli);

  const f3Or = AG, f3Kli = Math.abs(D - AG);
  const f3T = coeficiente(f3Or, f3Kli);

  // F4: el cuerpo como vasija de la dispersión total del sistema.
  // Or = reducir(D+M+AG). Kli = |D-M| + |M-AG| + |D-AG| = 2x(max-min de D,M,AG).
  // El cuerpo absorbe el rango completo de tension entre lo mas intimo (D)
  // y lo mas colectivo (AG), con M como punto intermedio.
  const f4Or = reducir(D + M + AG);
  const f4Kli = Math.abs(D - M) + Math.abs(M - AG) + Math.abs(D - AG);
  const f4T = coeficiente(f4Or, f4Kli);

  return [
    { plano:'F1', nombre:'Alma', mundo:'Atzilut', or:f1Or, kli:f1Kli, tense:f1T, zona:getZona(f1T) },
    { plano:'F2', nombre:'Mente', mundo:'Briáh', or:f2Or, kli:f2Kli, tense:f2T, zona:getZona(f2T) },
    { plano:'F3', nombre:'Yo Social', mundo:'Yetziráh', or:f3Or, kli:f3Kli, tense:f3T, zona:getZona(f3T) },
    { plano:'F4', nombre:'Cuerpo', mundo:'Assiáh', or:f4Or, kli:f4Kli, tense:f4T, zona:getZona(f4T) },
  ];
}

// ─── LÓGICA TRANSGENERACIONAL ───────────────────────────────────────────────

function leerAncestro(prefijoDia, prefijoMes, prefijoAnio) {
  const d = parseInt(document.getElementById(prefijoDia).value);
  const m = parseInt(document.getElementById(prefijoMes).value);
  const a = parseInt(document.getElementById(prefijoAnio).value);
  if (!d || !m || !a || isNaN(d) || isNaN(m) || isNaN(a)) return null;
  return { dia: d, mes: m, anio: a };
}

const PLANOS_NOMBRES = ['Alma', 'Mente', 'Yo Social', 'Cuerpo'];

function esExtremo(zona) { return zona === 'desborde' || zona === 'vaciado'; }

function calcularResonancias(perfilConsultante, ancestros) {
  // Jerarquía estricta (fallback): presión > compensación > sostén > desplazada > pionero.
  // Cada plano recibe a lo sumo UN tipo de resonancia — máxima especificidad.
  // La desplazada solo se busca si el mismo plano no resonó: si el material
  // encontró su registro en el mismo mundo, no necesitó desplazarse.
  return perfilConsultante.map((f, i) => {
    const vacio = { tipo: null, directas: [], compensatorias: [], sostenes: [], desplazadas: [], realizados: [] };
    if (f.zona === 'tzimtzum') return vacio;

    // ── 0. Plano en Tiferet: tikún realizado ──
    // El plano equilibrado no porta klipá, pero puede portar HISTORIA:
    // si un ancestro llevó la misma sefirá en distorsión en este mismo plano,
    // el equilibrio del consultante no es ausencia de herencia sino herencia
    // metabolizada — el tikún fue realizado. (Inverso del sostén.)
    if (f.zona === 'equilibrio') {
      const realizados = [];
      ancestros.forEach(({ nombre, perfil }) => {
        const fa = perfil[i];
        if (!fa || fa.zona === 'tzimtzum' || fa.zona === 'equilibrio') return;
        if (fa.or !== f.or) return;
        realizados.push({ nombre, vector: esExceso(fa.zona) ? 'exceso' : 'déficit' });
      });
      if (realizados.length > 0) return { tipo:'realizado', directas: [], compensatorias: [], sostenes: [], desplazadas: [], realizados };
      return vacio;
    }

    // ── 1. Resonancias en el mismo plano ──
    const directas = [], compensatorias = [], sostenes = [];
    ancestros.forEach(({ nombre, perfil }) => {
      const fa = perfil[i];
      if (!fa || fa.zona === 'tzimtzum') return;
      if (fa.or !== f.or) return;

      if (
        (esExceso(f.zona) && esExceso(fa.zona)) ||
        (esDeficit(f.zona) && esDeficit(fa.zona))
      ) {
        directas.push(nombre);
      } else if (
        (esExceso(f.zona) && esDeficit(fa.zona)) ||
        (esDeficit(f.zona) && esExceso(fa.zona))
      ) {
        compensatorias.push(nombre);
      } else if (fa.zona === 'equilibrio') {
        sostenes.push(nombre);
      }
    });

    if (directas.length > 0) return { tipo:'presion', directas, compensatorias, sostenes, desplazadas: [], realizados: [] };
    if (compensatorias.length > 0) return { tipo:'compensacion', directas, compensatorias, sostenes, desplazadas: [], realizados: [] };
    if (sostenes.length > 0) return { tipo:'sosten', directas, compensatorias, sostenes, desplazadas: [], realizados: [] };

    // ── 2. Fallback: resonancia desplazada (inter-plano) ──
    // Requisitos: misma sefirá, mismo vector, zona EXTREMA en ambos lados
    // (Saturación o Vaciado — no Tenso ni Precario), distinto plano.
    // Descendente (↓): el ancestro la portaba en un mundo más sutil — el material
    // no elaborado desciende y se densifica (somatización transgeneracional).
    // Ascendente (↑): el patrón sube hacia planos más sutiles — hipótesis abierta.
    const desplazadas = [];
    if (esExtremo(f.zona)) {
      ancestros.forEach(({ nombre, perfil }) => {
        perfil.forEach((fa, j) => {
          if (j === i || !fa || fa.zona === 'tzimtzum') return;
          if (fa.or !== f.or) return;
          if (!esExtremo(fa.zona)) return;
          if (
            (esExceso(f.zona) && esExceso(fa.zona)) ||
            (esDeficit(f.zona) && esDeficit(fa.zona))
          ) {
            desplazadas.push({
              nombre,
              desde: PLANOS_NOMBRES[j],
              hacia: PLANOS_NOMBRES[i],
              direccion: j < i ? 'desc' : 'asc'
            });
          }
        });
      });
    }
    if (desplazadas.length > 0) return { tipo:'desplazada', directas: [], compensatorias: [], sostenes: [], desplazadas, realizados: [] };

    // ── 3. Tikún pionero (estricto) ──
    // La sefirá no tiene precedente en NINGÚN plano del campo disponible.
    // Solo se declara con 3+ ancestros cargados: con menos generaciones
    // la ausencia de precedente no es significativa — el campo es demasiado
    // pequeño para afirmar que la sefirá es inaugural.
    if (ancestros.length >= 3) {
      const hayPrecedente = ancestros.some(({ perfil }) =>
        perfil.some(fa => fa && fa.zona !== 'tzimtzum' && fa.or === f.or)
      );
      if (!hayPrecedente) return { tipo:'pionero', directas: [], compensatorias: [], sostenes: [], desplazadas: [], realizados: [], generaciones: ancestros.length };
    }

    // Hay precedente de la sefirá en el campo, pero ninguna resonancia calificó:
    // no se indica nada — cada badge significa algo.
    return vacio;
  });
}

// ─── CAPA DE OBSERVACIONES (correspondencias a chequear) ───────────────────
// A diferencia de las resonancias (badges, modo afirmativo, umbral estricto),
// las observaciones son correspondencias que casi califican pero no llegan al
// umbral de "extremo en ambos lados". Se narran SIEMPRE en modo interrogativo:
// hipótesis de klipá a explorar en sesión, nunca hallazgo. Máximo 2 por plano,
// priorizadas por cercanía al umbral real (extremo verdadero).

const KLIPOT_DEFICIT = {

// ─── TABLAS DE TIKÚN (dirección de corrección) ──────────────────────────────
// Complementan a KLIPOT_EXCESO/KLIPOT_DEFICIT: mientras las klipot nombran la

const TIKUN_EXCESO = {

  5: 'Reconocer que la fuerza real está en el autocontrol, no en la dominación; buscar la validación de la propia fuerza puertas adentro en vez de imponerla afuera',

function tikunDe(or, esExc) {
  const tabla = esExc ? TIKUN_EXCESO : TIKUN_DEFICIT;
  return tabla[or] || (esExc ? 'moderar y anclar el exceso' : 'construir gradualmente lo que falta');
}

// ─── ETIQUETA DE UNA PALABRA: qué hace falta ────────────────────────────────
// Para las tarjetas de perfil (F1–F4). Resume en una palabra la dirección del
// tikún de esa sefirá/polaridad — no describe la distorsión, describe la
// carencia a trabajar. Solo se muestra cuando hay klipá activa (exceso o
// déficit); Equilibrio Operativo no lleva etiqueta, y Tzimtzum lleva 'Vasija'
// (construir el Kli que el sistema no proveyó) resuelto aparte en el render.

const TIKUN_PALABRA_EXCESO = {
  1:'Descenso', 2:'Anclaje', 3:'Flexibilidad', 4:'Límite', 5:'Autocontrol',
  6:'Humildad', 7:'Medida', 8:'Acción', 9:'Autenticidad', 10:'Desapego',
};

const TIKUN_PALABRA_DEFICIT = {
  1:'Propósito', 2:'Confianza', 3:'Estructura', 4:'Perdón', 5:'Recepción',
  6:'Autoestima', 7:'Expresión', 8:'Palabra', 9:'Vínculo', 10:'Presencia',
};

function tikunPalabraDe(or, esExc, zona) {
  if (zona === 'tzimtzum') return 'Vasija';
  if (zona === 'equilibrio') return '';
  const tabla = esExc ? TIKUN_PALABRA_EXCESO : TIKUN_PALABRA_DEFICIT;
  return tabla[or] || '';
}

function klipotDe(or, esExc) {
  const tabla = esExc ? KLIPOT_EXCESO : KLIPOT_DEFICIT;
  return tabla[or] || (esExc ? 'klipá de exceso' : 'klipá de déficit');
}

// Distancia al "extremo verdadero" (0 = perfectamente saturado/vaciado).
// Para exceso: 1 - t. Para déficit: t.
function distanciaExtremo(t, esExc) {
  return esExc ? (1 - t) : t;
}

function calcularObservaciones(perfilConsultante, ancestros) {
  return perfilConsultante.map((f, i) => {
    if (f.zona === 'tzimtzum' || f.zona === 'equilibrio') return [];
    const obs = [];
    const fExceso = esExceso(f.zona);
    const fExtremo = esExtremo(f.zona);

    ancestros.forEach(({ nombre, perfil }) => {
      perfil.forEach((fa, j) => {
        if (!fa) return;

        // ── Ancestro en Tzimtzum en el mismo plano ──
        if (j === i && fa.zona === 'tzimtzum') {
          obs.push({
            tipo: 'tzimtzum_origen',
            nombre,
            score: 0.6, // disponible, pero no debe tapar correspondencias de sefirá específicas
            texto: `${nombre} no llegó a constituir vasija en ${PLANOS_NOMBRES[i]} (Tzimtzum). ¿Qué se hereda de un plano que en el origen no terminó de formarse? ¿Podría la ${klipotDe(f.or, fExceso)} del consultante en este plano estar relacionada con la ausencia de modelo — un territorio que hubo que construir sin referencia disponible?`
          });
          return;
        }

        if (fa.zona === 'tzimtzum' || fa.zona === 'equilibrio') return;
        if (fa.or !== f.or) {
          // ── Compensación cruzada de plano (distinta sefirá, vector opuesto, distinto plano) ──
          if (j !== i && fExteso_check(fExceso, fa.zona)) {
            const faExceso = esExceso(fa.zona);
            if (fExceso !== faExceso) {
              const dir = j < i ? 'descendente' : 'ascendente';
              obs.push({
                tipo: 'compensacion_cruzada',
                nombre,
                score: distanciaExtremo(f.tense, fExceso) + distanciaExtremo(fa.tense, faExceso) + 0.15,
                texto: `${nombre} porta ${SEFIROT[fa.or]} en ${zonaNombre(fa.zona)} (${PLANOS_NOMBRES[j]}), vector opuesto al ${SEFIROT[f.or]} ${zonaNombre(f.zona)} del consultante en ${PLANOS_NOMBRES[i]} (cruce ${dir} de mundo). ¿Podría explorarse si la ${klipotDe(fa.or, faExceso)} del ancestro se relaciona, por compensación, con la ${klipotDe(f.or, fExceso)} del consultante? ¿O son procesos independientes que conviven en el campo sin relación entre sí?`
              });
            }
          }
          return;
        }

        // ── Misma sefirá, mismo plano: ya cubierto por resonancias (no duplicar) ──
        if (j === i) return;

        // ── Desplazada no-extrema (mismo Or, distinto plano, mismo vector, no ambos extremos) ──
        const faExceso = esExceso(fa.zona);
        if (fExceso === faExceso && !(fExtremo && esExtremo(fa.zona))) {
          const dir = j < i ? 'descendente' : 'ascendente';
          obs.push({
            tipo: 'desplazada_leve',
            nombre,
            score: distanciaExtremo(f.tense, fExceso) + distanciaExtremo(fa.tense, faExceso),
            texto: `${nombre} porta ${SEFIROT[fa.or]} en ${zonaNombre(fa.zona)} (${PLANOS_NOMBRES[j]}), mismo vector que el ${SEFIROT[f.or]} ${zonaNombre(f.zona)} del consultante en ${PLANOS_NOMBRES[i]}, pero sin que ambos lados alcancen el extremo (cruce ${dir} de mundo). ¿Podría explorarse si la ${klipotDe(fa.or, faExceso)} del ancestro en ${PLANOS_NOMBRES[j]} desciende/asciende como ${klipotDe(f.or, fExceso)} en ${PLANOS_NOMBRES[i]}? ¿O son procesos independientes que comparten sefirá por coincidencia estructural?`
          });
        }
      });
    });

    // Cap variable: 2 fijo, +1 si hay 3+ ancestros distintos con candidato
    // para este plano — cuando el campo tiene mucho que decir, se le da
    // un lugar más, sin que los planos con poco material se inflen igual.
    const porAncestro = {};
    obs.forEach(o => {
      if (!porAncestro[o.nombre] || o.score < porAncestro[o.nombre].score) {
        porAncestro[o.nombre] = o;
      }
    });
    const candidatos = Object.values(porAncestro).sort((a, b) => a.score - b.score);
    const cap = candidatos.length >= 3 ? 3 : 2;
    return candidatos.slice(0, cap);
  });
}

function buildPrompt(nombre, dia, mes, anio, perfil, ancestros, resonancias, observaciones, historia) {
  const lines = perfil.map((f, i) => {
    const r = resonancias[i];
    let resonanciaStr = '';
    if (r && r.tipo === 'presion') {
      resonanciaStr = ` | PRESIÓN TRANSGENERACIONAL DIRECTA (${r.directas.join(', ')}): la klipá viene consolidada desde el campo ancestral, patrón heredado sin transformación`;
    } else if (r && r.tipo === 'compensacion') {
      resonanciaStr = ` | RESONANCIA COMPENSATORIA (${r.compensatorias.join(', ')}): vector opuesto en ancestro/s — posible implicación sistémica, lealtad invisible, respuesta al desequilibrio del campo`;
    } else if (r && r.tipo === 'sosten') {
      resonanciaStr = ` | RESONANCIA DE SOSTÉN (${r.sostenes.join(', ')}): la misma sefiráh fue llevada al equilibrio en el campo ancestral — el tikún tiene precedente realizado, hay recurso disponible en el linaje`;
    } else if (r && r.tipo === 'desplazada') {
      const det = r.desplazadas.map(d => `${d.nombre}: ${d.desde} → ${d.hacia}, ${d.direccion === 'desc' ? 'DESCENDENTE' : 'ASCENDENTE'}`).join('; ');
      resonanciaStr = ` | RESONANCIA DESPLAZADA (${det}): misma sefiráh en vector extremo coincidente pero en distinto plano del campo ancestral — transmisión inter-mundo`;
    } else if (r && r.tipo === 'realizado') {
      const det = r.realizados.map(d => `${d.nombre} (vector ancestral: ${d.vector})`).join('; ');
      resonanciaStr = ` | TIKÚN REALIZADO (${det}): la misma sefiráh fue portada en distorsión por el/los ancestro/s en este mismo plano y llega al consultante en equilibrio — herencia metabolizada, no ausencia de historia`;
    } else if (r && r.tipo === 'pionero') {
      resonanciaStr = ` | SIN HUELLA VISIBLE: la sefiráh no aparece en ninguna posición del campo registrado (1 generación: padres). Esto es un dato sobre la VENTANA disponible, no sobre el linaje completo — siete generaciones atrás son más de 60 personas, y esta ventana muestra apenas 2`;
    }
    let observacionesStr = '';
    const obsPlano = observaciones && observaciones[i] ? observaciones[i] : [];
    if (obsPlano.length > 0) {
      observacionesStr = '\n  OBSERVACIONES (correspondencias a chequear — no afirmar, solo preguntar):\n' +
        obsPlano.map(o => `  - ${o.texto}`).join('\n');
    }
    let tikunStr = '';
    if (f.zona !== 'tzimtzum' && f.zona !== 'equilibrio') {
      tikunStr = `\n  TIKÚN de este plano: ${tikunDe(f.or, esExceso(f.zona))}`;
    }
    return `${f.plano} — ${f.nombre} (${f.mundo}): Or=${f.or} (${SEFIROT[f.or]||f.or}), Kli=${f.kli}, TENSe=${f.tense!==null?f.tense:'Tzimtzum'}, Zona=${zonaNombre(f.zona)}${resonanciaStr}${observacionesStr}${tikunStr}`;
  }).join('\n');

  const ancestrosStr = ancestros.length > 0
    ? `\nCampo transgeneracional incluido: ${ancestros.map(a => {
        let info = `${a.nombre} (${a.dia}/${a.mes}/${a.anio})`;
        if (a.marcador) info += ` — marcador: "${a.marcador}"`;
        if (a.historia) info += ` — historia relevante: "${a.historia}"`;
        return info;
      }).join(', ')}.`
    : '\nNo se dispone de fechas ancestrales.';
  const historiaConsultanteStr = historia ? `\nHistoria relevante del consultante: ${historia}` : '';

  return `Eres un sistema de diagnóstico psicodinámico que integra psicología clínica profunda, Kabbalah y psicología sistémica (Hellinger). Generás diagnósticos narrativos precisos para terapeutas especializados con formación kabbalística, transgeneracional y sistémica.

El sistema TENSe calcula el Or (luz/sefirá activa) y el Kli (vasija/resistencia) de cuatro planos de existencia (Atzilut=Alma, Briáh=Mente, Yetziráh=Yo Social, Assiáh=Cuerpo). El coeficiente TENSe es Or/Kli. La escala calibrada es: Vaciado (<0.50, Klipá de la Apatía), Precario (0.50–0.99, Klipá de la Inseguridad), Equilibrio Operativo (1.00–1.50, sin klipá activa), Saturación (1.51–3.00, Klipá de la Obsesión), Desborde (>3.00, Klipá del Quiebre / Shevirat HaKelim). Kli=0 se indica como Tzimtzum: Or sin vasija — índice = Or, luz pura sin filtro. Las klipot son los umbrales que la sefirá adopta cuando el Kli no puede integrarla — cada sefirá tiene klipot de exceso y de déficit cualitativamente distintas. La klipá no es patología: es la forma que toma el sueño de la ilusión en esa frecuencia, y simultáneamente señala la dirección del tikún.

MARCO INTEGRADO: el diagnóstico teje dos lenguajes de forma orgánica, sin etiquetarlos por separado. El lenguaje kabbalístico (sefirá, klipá, Or/Kli, tikún) y el lenguaje sistémico (pertenencia, orden del amor, equilibrio entre dar y tomar, exclusiones del campo, lealtades invisibles, mandatos sistémicos, movimientos de alma) se leen como frecuencias distintas del mismo campo. No se dice "desde la psicología sistémica...": se nombra la lealtad invisible, la exclusión, el mandato, el desequilibrio sistémico como parte natural de la lectura de la sefirá y su klipá. Ejemplo de integración: "La klipá de Gevurá en exceso en F3 opera como control relacional — y en el campo sistémico se lee como la lealtad a un orden donde el límite fue siempre dominio: quien heredó ese modelo porta también el mandato de reproducirlo para pertenecer."

CAPA SISTÉMICA POR TIPO DE RESONANCIA:

Cuando se indica PRESIÓN TRANSGENERACIONAL DIRECTA: la klipá viene consolidada desde el campo, patrón heredado sin transformación. En el lenguaje sistémico: algo en el sistema no fue dicho, no fue visto, no fue honrado — y ese no-lugar se transmite como carga. La narrativa integra qué orden del amor puede estar perturbado en esa frecuencia sefirótica específica.

Cuando se indica RESONANCIA COMPENSATORIA: el consultante porta el vector opuesto al ancestro. En el lenguaje sistémico: lealtad invisible al desequilibrio del campo — el consultante hace lo contrario del ancestro pero sigue siendo movido por la misma fuerza. La narrativa nombra el movimiento de desengancho necesario: reconocer la lealtad sin quedar atrapado en ella.

Cuando se indica RESONANCIA DE SOSTÉN: un ancestro porta la misma sefirá en equilibrio. En el lenguaje sistémico: hay un lugar en el campo donde ese amor ya fluyó — un ancestro transitó ese tikún. El consultante puede mirarlo, reconocerlo y recibir lo que ese lugar del linaje tiene para ofrecer. La narrativa honra ese recurso sin romantizarlo.

Cuando se indica RESONANCIA DESPLAZADA DESCENDENTE (mundo más sutil del ancestro → mundo más denso del consultante): somatización transgeneracional — lo que no encontró forma en una generación desciende como cuerpo en la siguiente (línea Dolto, Abraham-Torok). En el lenguaje sistémico: lo que no pudo ser dicho o sentido en el campo se encarna. La narrativa puede afirmar este mecanismo y nombrar el plano de origen y el de llegada.

Cuando se indica RESONANCIA DESPLAZADA ASCENDENTE: hipótesis abierta — puede ser tikún en curso (el patrón se eleva hacia conciencia) o intelectualización defensiva. La narrativa ofrece ambas lecturas sin afirmar ninguna.

Cuando se indica TIKÚN REALIZADO: el consultante porta en Equilibrio Operativo la misma sefirá que un ancestro portó en distorsión. En el lenguaje sistémico: algo fue restaurado en el orden del amor — la herencia llegó metabolizada. La narrativa honra el origen ancestral del patrón y reconoce el trabajo logrado sin borrar la historia.

Cuando se indica SIN HUELLA VISIBLE: la sefirá no aparece en la ventana ancestral registrada. No se narra como pionerismo absoluto — es un dato sobre el alcance de lo registrado, no sobre el linaje completo. En el lenguaje sistémico: puede haber un lugar en el sistema donde esa cualidad no encontró expresión visible, sin afirmar que no existe en generaciones anteriores no documentadas.

Cuando un plano está en Equilibrio Operativo sin tikún realizado: se narra como el recurso que el equilibrio representa. En el lenguaje sistémico: un lugar donde el flujo entre dar y recibir está operativo — un punto de apoyo desde donde trabajar lo que sí está en tensión.

Cuando un plano incluye OBSERVACIONES: se integran como pregunta abierta al final del párrafo, en modo interrogativo, nunca como conclusión. Máximo una por párrafo. No deben competir en peso con las resonancias confirmadas.

Cuando hay Tzimtzum (Kli=0): Or sin vasija. En el lenguaje sistémico: un lugar en el campo que no llegó a constituirse como contenedor — puede haber un ancestro que tampoco tuvo acceso a esa cualidad, o un mandato sistémico que prohibió esa frecuencia. La narrativa señala la dirección terapéutica: construir el Kli, hacer el propio Tzimtzum, aprender el límite que el sistema no proveyó.

TIKÚN DE CADA PLANO: cuando un plano incluye la línea "TIKÚN de este plano", esa frase es el insumo con el que se construye la sección final de TIKÚN (ver formato de salida). No se repite textualmente en el párrafo de ese plano — el párrafo de F1–F4 se queda enfocado en nombrar la klipá y su raíz. El tikún se desarrolla aparte, después de la síntesis, integrando los cuatro insumos en una narrativa única y coherente, no en cuatro párrafos sueltos repetidos.

MARCADORES E HISTORIA RELEVANTE: el marcador (evento objetivo breve) y la historia relevante del ancestro se usan únicamente cuando ese ancestro aparece en una resonancia o en una observación — enriquecen esa narrativa puntual. Nunca se usan para inferir coeficientes o badges que el cálculo no produjo. La historia relevante del consultante se integra donde sea pertinente sin sobresaturar cada plano.

Perfil del consultante: ${nombre}
Fecha de nacimiento: ${dia}/${mes}/${anio}${ancestrosStr}${historiaConsultanteStr}

${lines}

Generá un diagnóstico narrativo completo con este formato exacto:

**F1 — ALMA / Atzilut**
[Párrafo de 5-7 líneas. Nombrar la sefirá, la zona, la klipá activa y — si aplica — la dimensión transgeneracional. Lenguaje kabbalístico-clínico preciso. Sin subtítulos internos.]

**TIKÚN**
[Párrafo narrativo de 6-10 líneas que desarrolla el tikún del sistema como un movimiento único y coherente — no cuatro tikumim sueltos repitiendo lo ya dicho, sino cómo se articulan entre sí (qué plano sostiene el trabajo de cuál, en qué orden conviene abordarlos, qué tensión hay que sostener sin resolver todavía). Integrar los insumos de "TIKÚN de este plano" de cada F1–F4 sin citarlos textualmente. Luego, en el mismo bloque, una lista de 3 a 5 actividades concretas de práctica —cosas que la persona puede efectivamente hacer entre sesiones, no solo actitudes a adoptar— derivadas de esos tikumim. Cada actividad en una línea propia, empezando con un guion, breve y accionable (ej. "- Antes de responder algo que activó un juicio rápido, esperar tres respiraciones y preguntarse qué se sentiría en el cuerpo si no se respondiera nada"). Las actividades deben ser específicas del perfil de la persona, no genéricas de bienestar.]

Tono: preciso, denso, no didáctico. El lector es terapeuta con formación kabbalística y transgeneracional.`;
}

async function calcular() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const dia = parseInt(document.getElementById('inp-dia').value);
  const mes = parseInt(document.getElementById('inp-mes').value);
  const anio = parseInt(document.getElementById('inp-anio').value);
  const errEl = document.getElementById('error-msg');

  errEl.style.display = 'none';

  if (!nombre || !dia || !mes || !anio || isNaN(dia) || isNaN(mes) || isNaN(anio)) {
    errEl.textContent = 'Por favor completá nombre y fecha del consultante.';
    errEl.style.display = 'block';
    return;
  }

  const historia = document.getElementById('inp-historia').value.trim();
  const perfil = calcularPerfil(dia, mes, anio);

  // Leer ancestros opcionales
  const ancestrosDefs = [
    { id: 'madre', label: 'Madre' },
    { id: 'padre', label: 'Padre' },
    { id: 'abuela-m', label: 'Abuela materna' },
    { id: 'abuelo-m', label: 'Abuelo materno' },
    { id: 'abuela-p', label: 'Abuela paterna' },
    { id: 'abuelo-p', label: 'Abuelo paterno' },
  ];

  const ancestros = [];
  ancestrosDefs.forEach(({ id, label }) => {
    const raw = leerAncestro(`${id}-dia`, `${id}-mes`, `${id}-anio`);
    if (raw) {
      const marcadorEl = document.getElementById(`${id}-marcador`);
      const marcador = marcadorEl ? marcadorEl.value.trim() : '';
      const historiaEl = document.getElementById(`${id}-historia`);
      const historiaAnc = historiaEl ? historiaEl.value.trim() : '';
      ancestros.push({
        nombre: label,
        dia: raw.dia,
        mes: raw.mes,
        anio: raw.anio,
        marcador,
        historia: historiaAnc,
        perfil: calcularPerfil(raw.dia, raw.mes, raw.anio)
      });
    }
  });

  const resonancias = calcularResonancias(perfil, ancestros);
  const observaciones = calcularObservaciones(perfil, ancestros);

  const btn = document.getElementById('btn-calcular');
  btn.disabled = true;
  btn.textContent = 'Generando...';

  const resEl = document.getElementById('resultado');
  resEl.style.display = 'block';
  resEl.innerHTML = renderPerfil(nombre, dia, mes, anio, perfil, ancestros, resonancias, observaciones, null, true);

  try {
    const response = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: buildPrompt(nombre, dia, mes, anio, perfil, ancestros, resonancias, observaciones, historia) })
    });

    const data = await response.json();
    const texto = data.content?.find(b => b.type === 'text')?.text || '';

    if (!texto) throw new Error('Respuesta vacía');

    currentResult = {
      nombre, dia, mes, anio, perfil,
      ancestros: ancestros.map(a => ({ nombre: a.nombre, dia: a.dia, mes: a.mes, anio: a.anio, perfil: a.perfil })),
      resonancias,
      observaciones,
      diagnostico: texto,
      fecha: new Date().toISOString()
    };
    guardarEnHistorial(currentResult);
    resEl.innerHTML = renderPerfil(nombre, dia, mes, anio, perfil, ancestros, resonancias, observaciones, texto, false);

  } catch(e) {
    errEl.textContent = 'Error al generar el diagnóstico. Verificá tu conexión o contactá al administrador.';
    errEl.style.display = 'block';
    resEl.style.display = 'none';
  }

  btn.disabled = false;
  btn.textContent = 'Generar diagnóstico';
}

function parseOutput(texto) {
  const s = {};
  // Lookaheads insensibles a tildes: el modelo puede escribir SÍNTESIS o SINTESIS, TIKÚN o TIKUN
  const p = [
    { k:'f1', r:/\*\*F1[^*]*\*\*\s*([\s\S]*?)(?=\*\*F2|\*\*S[ÍI]NT|\*\*TIK[ÚU]N|$)/i },
    { k:'f2', r:/\*\*F2[^*]*\*\*\s*([\s\S]*?)(?=\*\*F3|\*\*S[ÍI]NT|\*\*TIK[ÚU]N|$)/i },
    { k:'f3', r:/\*\*F3[^*]*\*\*\s*([\s\S]*?)(?=\*\*F4|\*\*S[ÍI]NT|\*\*TIK[ÚU]N|$)/i },
    { k:'f4', r:/\*\*F4[^*]*\*\*\s*([\s\S]*?)(?=\*\*S[ÍI]NT|\*\*TIK[ÚU]N|$)/i },
    { k:'sintesis', r:/\*\*S[ÍI]NTESIS[^*]*\*\*\s*([\s\S]*?)(?=\*\*TIK[ÚU]N|$)/i },
    { k:'tikun', r:/\*\*TIK[ÚU]N[^*]*\*\*\s*([\s\S]*?)$/i },
  ];
  p.forEach(({k,r}) => { const m = texto.match(r); s[k] = m ? m[1].trim() : ''; });
  return s;
}

function resonanciaBadge(r) {
  if (!r || !r.tipo) return '';
  if (r.tipo === 'presion') return `<span class="badge badge-presion">Presión · ${r.directas.join(', ')}</span>`;
  if (r.tipo === 'compensacion') return `<span class="badge badge-compensacion">Compensación · ${r.compensatorias.join(', ')}</span>`;
  if (r.tipo === 'sosten') return `<span class="badge badge-sosten">Sostén · ${r.sostenes.join(', ')}</span>`;
  if (r.tipo === 'desplazada') {
    const tags = r.desplazadas.map(d => `${d.direccion === 'desc' ? '↓' : '↑'} ${d.nombre} · ${d.desde}→${d.hacia}`).join(' / ');
    return `<span class="badge badge-desplazada">Desplazada ${tags}</span>`;
  }
  if (r.tipo === 'realizado') return `<span class="badge badge-realizado">Tikún realizado · ${r.realizados.map(d => d.nombre).join(', ')}</span>`;
  if (r.tipo === 'pionero') return `<span class="badge badge-pionero">Sin huella visible</span>`;
  return '';
}

function renderPerfil(nombre, dia, mes, anio, perfil, ancestros, resonancias, observaciones, diagnostico, loading) {

  const claves = ['f1','f2','f3','f4'];
  const labels = ['F1 — Alma · Atzilut','F2 — Mente · Briáh','F3 — Yo Social · Yetziráh','F4 — Cuerpo · Assiáh'];

  const ancestrosInfo = ancestros && ancestros.length > 0
    ? `Campo transgeneracional: ${ancestros.map(a => `${a.nombre} (${a.dia}/${a.mes}/${a.anio})${a.marcador ? ` — ${a.marcador}` : ''}`).join(' · ')}`
    : '';

  let html = `

        </div>
      `;}).join('')}

  perfil.forEach((f, i) => {

        </div>
        <div class="output-body ${loading?'loading':''}">${contenido}${obsHtml}</div>
      </div>
    `;
  });

  const sinContenido = loading
    ? `<span class="spinner"></span> Generando síntesis...`
    : (s['sintesis'] || '—');

  html += `
    <div class="output-section">
      <div class="output-header sintesis-header">
        <span class="output-header-label">Síntesis integradora</span>
        <span style="flex:1"></span>
        <span class="output-header-sefira">Lectura del sistema completo</span>
      </div>
      <div class="output-body ${loading?'loading':''}">${sinContenido}</div>
    </div>
  `;

  const tikunContenido = loading
    ? `<span class="spinner"></span> Generando tikún...`
    : (s['tikun'] || '—');

  html += `
    <div class="output-section">
      <div class="output-header sintesis-header">
        <span class="output-header-label">Tikún</span>
        <span style="flex:1"></span>
        <span class="output-header-sefira">Dirección de trabajo y práctica</span>
      </div>
      <div class="output-body ${loading?'loading':''}">${tikunContenido}</div>
    </div>
  `;

  if (!loading) {
    html += `
      <div class="export-bar">
        <button class="btn-export" onclick="exportarPDF()">↓ Exportar PDF</button>
      </div>
    `;
  }

  return html;
}

function guardarEnHistorial(entry) {
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  stored.unshift(entry);
  if (stored.length > 200) stored.pop();
  localStorage.setItem('tense_historial', JSON.stringify(stored));
}

function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'historial') renderHistorial();
}

function renderHistorial() {
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  const el = document.getElementById('historial-content');
  if (!stored.length) {
    el.innerHTML = '<div class="empty-state">No hay diagnósticos guardados aún.</div>';
    return;
  }
  el.innerHTML = `<div class="historial-list">
    ${stored.map((e, i) => {
      const tieneAncestros = e.ancestros && e.ancestros.length > 0;
      return `
      <div class="historial-item" onclick="verHistorial(${i})">
        <div>
          <div class="historial-name">${e.nombre}</div>
          <div class="historial-fecha">${e.dia}/${e.mes}/${e.anio}${tieneAncestros ? ` · ${e.ancestros.length} ancestro${e.ancestros.length>1?'s':''}` : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="historial-meta">${new Date(e.fecha).toLocaleDateString('es-AR')}</div>
          <button class="historial-delete" onclick="event.stopPropagation();eliminarHistorial(${i})" title="Eliminar">×</button>
        </div>
      </div>
    `}).join('')}
  </div>`;
}

function verHistorial(i) {
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  const e = stored[i];
  currentResult = e;
  showPanel('calcular');
  const resEl = document.getElementById('resultado');
  resEl.style.display = 'block';
  resEl.innerHTML = renderPerfil(
    e.nombre, e.dia, e.mes, e.anio, e.perfil,
    e.ancestros || [], e.resonancias || [], e.observaciones || [],
    e.diagnostico, false
  );
}

function eliminarHistorial(i) {
  if (!confirm('¿Eliminar este diagnóstico del historial?')) return;
  const stored = JSON.parse(localStorage.getItem('tense_historial') || '[]');
  stored.splice(i, 1);
  localStorage.setItem('tense_historial', JSON.stringify(stored));
  renderHistorial();
}

function exportarPDF() {
  if (!currentResult) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const e = currentResult;
  const margin = 22, maxW = 210 - margin * 2;
  let y = 22;

  const line = (text, size, style, rgb) => {
    doc.setFontSize(size);
    doc.setFont('helvetica', style || 'normal');
    doc.setTextColor(...(rgb || [26, 26, 46]));
    const lines = doc.splitTextToSize(String(text), maxW);
    lines.forEach(l => {
      if (y > 272) { doc.addPage(); y = 22; }
      doc.text(l, margin, y);
      y += size * 0.46;
    });
    y += 2;
  };

  line('TENSe — Diagnóstico Psicodinámico', 17, 'bold', [184, 134, 11]);
  line(`${e.nombre}  ·  ${e.dia}/${e.mes}/${e.anio}`, 11, 'italic', [107, 107, 138]);

  if (e.ancestros && e.ancestros.length > 0) {
    line(`Campo transgeneracional: ${e.ancestros.map(a => `${a.nombre} (${a.dia}/${a.mes}/${a.anio})${a.marcador ? ' — ' + a.marcador : ''}`).join(' · ')}`, 9, 'italic', [107, 107, 138]);
  }

  y += 5;

  const s = parseOutput(e.diagnostico);
  const labels = [
    'F1 — ALMA / Atzilut', 'F2 — MENTE / Briáh',
    'F3 — YO SOCIAL / Yetziráh', 'F4 — CUERPO / Assiáh'
  ];
  const claves = ['f1','f2','f3','f4'];

  e.perfil.forEach((f, i) => {
    if (y > 250) { doc.addPage(); y = 22; }
    const r = e.resonancias && e.resonancias[i];
    let resonanciaTag = '';
    if (r && r.tipo === 'presion') resonanciaTag = ` · Presión: ${r.directas.join(', ')}`;
    else if (r && r.tipo === 'compensacion') resonanciaTag = ` · Compensación: ${r.compensatorias.join(', ')}`;
    else if (r && r.tipo === 'sosten') resonanciaTag = ` · Sostén: ${r.sostenes.join(', ')}`;
    else if (r && r.tipo === 'desplazada') resonanciaTag = ` · Desplazada: ${r.desplazadas.map(d => `${d.direccion === 'desc' ? '↓' : '↑'} ${d.nombre} ${d.desde}→${d.hacia}`).join(', ')}`;
    else if (r && r.tipo === 'realizado') resonanciaTag = ` · Tikún realizado: ${r.realizados.map(d => `${d.nombre} (${d.vector})`).join(', ')}`;
    else if (r && r.tipo === 'pionero') resonanciaTag = ' · Sin huella visible (ventana: 1 generación)';
    const tenseStr = f.tense !== null ? `TENSe ${Number(f.tense).toFixed(2)}` : 'Tzimtzum';
    const palabraTag = tikunPalabraDe(f.or, esExceso(f.zona), f.zona);
    const necesitaTag = palabraTag ? ` · Necesita: ${palabraTag}` : '';
    line(`${labels[i]}  ·  ${SEFIROT[f.or]||f.or}  ·  ${tenseStr}  ·  ${zonaNombre(f.zona)}${resonanciaTag}${necesitaTag}`, 11, 'bold', [61, 61, 92]);
    y += 1;
    line(s[claves[i]] || '', 10, 'normal', [30, 30, 50]);
    const obsPlano = (e.observaciones && e.observaciones[i]) || [];
    if (obsPlano.length > 0) {
      y += 1;
      line('A chequear:', 9, 'bold', [120, 120, 140]);
      obsPlano.forEach(o => line('· ' + o.texto, 9, 'italic', [120, 120, 140]));
    }
    y += 4;
  });

  if (y > 245) { doc.addPage(); y = 22; }
  line('SÍNTESIS INTEGRADORA', 11, 'bold', [26, 21, 92]);
  y += 1;
  line(s['sintesis'] || '', 10, 'normal', [30, 30, 50]);

  y += 4;
  if (y > 245) { doc.addPage(); y = 22; }
  line('TIKÚN', 11, 'bold', [26, 21, 92]);
  y += 1;
  line(s['tikun'] || '', 10, 'normal', [30, 30, 50]);

  y += 10;
  line(`TENSe  ·  ${new Date().toLocaleDateString('es-AR')}`, 8, 'italic', [160, 160, 160]);

  doc.save(`TENSe_${e.nombre.replace(/\s+/g,'_')}_${e.dia}-${e.mes}-${e.anio}.pdf`);
}
</script>

</html>
